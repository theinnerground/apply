<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Inner Ground Program — Application</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Federo&family=Gloock&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4EEE4;--card:#FBF7F0;--cocoa:#5E3B2E;--olive:#7A6A44;--sand:#EBDFCA;--sandb:#D9C6A1;--gold:#B98E57;--ink:#46392F;--muted:#857563;--err:#A4482F;
--display:'Gloock',Georgia,serif;--soft:'Federo',Georgia,serif;--body:'Montserrat',system-ui,sans-serif}
html[dir=rtl]{--display:'Amiri',serif;--soft:'Amiri',serif;--body:'IBM Plex Sans Arabic',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}
html[dir=rtl] body{font-size:16.5px;line-height:1.75}
.wrap{max-width:720px;margin:0 auto;padding:28px 18px 70px}
.top{display:flex;justify-content:flex-end}
.lang{display:inline-flex;border:1px solid var(--sandb);border-radius:40px;overflow:hidden;background:var(--card)}
.lang button{border:0;background:none;font:500 13px var(--body);color:var(--olive);padding:7px 16px;cursor:pointer}
.lang button[data-on]{background:var(--sand);color:var(--cocoa)}
.lang button:nth-child(2){font-family:'IBM Plex Sans Arabic',sans-serif}
header{text-align:center;margin:10px 0 26px}
header img{width:66px;height:66px;object-fit:contain}
.eyebrow{font:600 11.5px var(--body);letter-spacing:3px;text-transform:uppercase;color:var(--olive);margin-top:14px}
html[dir=rtl] .eyebrow{letter-spacing:0;font-size:14px}
.brand{font-family:'Gloock',serif;color:var(--cocoa);font-size:clamp(26px,6vw,38px);line-height:1.05;letter-spacing:.5px;margin-top:8px}
.brand small{display:block;font-size:.62em;letter-spacing:2px;margin-top:4px}
.rule{width:120px;border-top:1px solid var(--gold);margin:20px auto 0}
.progress{margin:0 0 18px}
.progress .meta{display:flex;justify-content:space-between;font:500 12.5px var(--body);color:var(--muted);margin-bottom:8px}
.bar{height:4px;background:var(--sand);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .4s ease}
.card{background:var(--card);border:1px solid var(--sandb);border-radius:22px;padding:30px 28px;box-shadow:0 1px 0 rgba(94,59,46,.03)}
@media(max-width:520px){.card{padding:24px 18px;border-radius:18px}}
h2{font-family:var(--display);font-weight:400;color:var(--cocoa);font-size:28px;line-height:1.2;margin-bottom:6px}
html[dir=rtl] h2{font-weight:700;font-size:30px}
.sec-n{font:600 11px var(--body);letter-spacing:2.5px;text-transform:uppercase;color:var(--olive)}
html[dir=rtl] .sec-n{letter-spacing:0;font-size:13px}
.intro p{margin-top:12px}
.intro p:first-of-type{font-family:var(--soft);font-size:18px;line-height:1.55;color:var(--cocoa)}
html[dir=rtl] .intro p:first-of-type{font-size:20px}
.q{margin-top:26px;transition:opacity .25s}
.q[hidden]{display:none}
.q.sub{margin-top:14px;padding-inline-start:16px;border-inline-start:2px solid var(--sand)}
.label{display:block;font-weight:500;color:var(--ink);margin-bottom:9px}
.label .req{color:var(--gold);margin-inline-start:3px}
.hint{font-size:13px;color:var(--muted);margin:-4px 0 9px}
input[type=text],input[type=email],input[type=tel],input[type=date],textarea{width:100%;font:inherit;color:var(--ink);background:#fff;border:1px solid var(--sandb);border-radius:12px;padding:11px 14px;outline:none;transition:border-color .2s,box-shadow .2s}
textarea{min-height:104px;resize:vertical}
input:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(185,142,87,.18)}
input[type=tel],input[type=email]{direction:ltr}
html[dir=rtl] input[type=tel],html[dir=rtl] input[type=email]{text-align:right}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:flex-start;gap:11px;padding:11px 14px;border:1px solid var(--sandb);border-radius:12px;background:#fff;cursor:pointer;transition:background .2s,border-color .2s}
.opt:hover{border-color:var(--gold)}
.opt input{appearance:none;flex:none;width:18px;height:18px;margin-top:3px;border:1.5px solid var(--gold);border-radius:50%;display:grid;place-content:center;background:#fff}
.opt input[type=checkbox]{border-radius:5px}
.opt input::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--cocoa);transform:scale(0);transition:transform .15s}
.opt input[type=checkbox]::before{border-radius:2px}
.opt input:checked::before{transform:scale(1)}
.opt:has(input:checked){background:var(--sand);border-color:var(--gold)}
.note{margin-top:26px;background:var(--sand);border-radius:16px;padding:16px 18px;font-size:14px}
.note b{display:block;font:600 11.5px var(--body);letter-spacing:2px;text-transform:uppercase;color:var(--olive);margin-bottom:4px}
html[dir=rtl] .note b{letter-spacing:0;font-size:13.5px}
.consent .opt{font-size:14.5px;line-height:1.55}
.err{display:none;color:var(--err);font-size:13px;margin-top:7px}
.q.bad .err{display:block}
.q.bad input,.q.bad textarea,.q.bad .opt{border-color:var(--err)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:30px}
.btn{font:500 15px var(--soft);letter-spacing:.8px;border-radius:40px;padding:12px 30px;cursor:pointer;border:1px solid var(--gold);background:var(--sand);color:var(--cocoa);transition:background .2s}
html[dir=rtl] .btn{font-family:var(--body);letter-spacing:0}
.btn:hover{background:#E3D3B6}
.btn.ghost{background:none;border-color:transparent;color:var(--olive)}
.btn.ghost:hover{background:none;text-decoration:underline}
.btn[disabled]{opacity:.6;cursor:wait}
.thanks{text-align:center;padding:46px 26px}
.thanks h2{font-size:30px}
.thanks p{margin-top:10px}
.demo{margin-top:18px;font-size:12px;color:var(--muted)}
dialog{margin:auto;border:1px solid var(--sandb);border-radius:22px;background:var(--card);color:var(--ink);padding:26px 24px;width:min(560px,calc(100vw - 32px));font-family:var(--body)}
dialog::backdrop{background:rgba(70,57,47,.38)}
dialog h3{font-family:var(--display);font-weight:400;color:var(--cocoa);font-size:24px}
html[dir=rtl] dialog h3{font-weight:700}
dialog p{margin:6px 0 14px;font-size:14.5px;color:var(--muted)}
dialog textarea{min-height:150px}
dialog .nav{margin-top:18px}
.linkbtn{margin-top:10px;background:none;border:0;color:var(--olive);font:500 14px var(--body);text-decoration:underline;cursor:pointer;padding:0}
input,textarea{font-size:16px !important}
input[type=date]{-webkit-appearance:none;appearance:none;min-height:46px;display:block}
@media(max-width:560px){
 body{font-size:15px}
 html[dir=rtl] body{font-size:16px}
 .wrap{padding:16px 14px 48px}
 header{margin:4px 0 18px}
 header img{width:54px;height:54px}
 .brand{font-size:27px}
 .card{padding:22px 16px;border-radius:18px}
 h2{font-size:24px}
 html[dir=rtl] h2{font-size:26px}
 .intro p:first-of-type{font-size:16.5px}
 .progress .meta{font-size:11.5px;gap:10px}
 .progress .meta span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .q{margin-top:22px}
 .q.sub{padding-inline-start:12px}
 .opt{padding:12px 12px;gap:10px}
 .nav{margin-top:26px}
 .btn{padding:12px 22px;font-size:14.5px}
 #next{flex:1;max-width:240px}
 dialog{padding:22px 18px}
}
footer{text-align:center;margin-top:28px;font:500 11px var(--body);letter-spacing:2.5px;color:var(--muted);text-transform:uppercase}
</style>
</head>

<script>
const FORM={"title": {"en": "Application Form", "ar": "نموذج التقديم"}, "brand": "The Inner Ground Program", "intro_h": {"en": "Before You Begin", "ar": "قبل أن تبدأ/ي"}, "intro": {"en": ["This form is not meant to judge or evaluate you. It simply helps us understand you, your experiences, and anything relevant to your participation.", "Please answer honestly and openly. There are no right or wrong answers.", "All information shared is confidential and treated with care and respect. No single answer automatically means acceptance or rejection.", "You do not need to prove anything. Just share what is true for you.", "The form takes around 15–20 minutes to complete."], "ar": ["هذا النموذج ليس للحكم عليك أو تقييمك، وإنما لمساعدتنا على فهمك وفهم خبراتك وأي أمور قد تكون ذات صلة بمشاركتك.", "أجب/ي بصدق وانفتاح، فلا توجد إجابات صحيحة أو خاطئة.", "جميع المعلومات سرية وسيتم التعامل معها بعناية واحترام. ولا توجد إجابة واحدة تعني تلقائيًا القبول أو الرفض.", "لا تحتاج/ين إلى إثبات أي شيء. فقط شارك/ي ما هو حقيقي بالنسبة لك.", "يستغرق ملء النموذج حوالي 15–20 دقيقة."]}, "sections": [{"title": {"en": "About You", "ar": "عنك"}, "fields": [{"id": "full_name", "type": "text", "req": true, "en": "Full name", "ar": "الاسم بالكامل", "h": "Full name"}, {"id": "dob", "type": "date", "req": true, "en": "Date of birth", "ar": "تاريخ الميلاد", "hint": {"en": "You must be 18 or older to apply.", "ar": "يجب أن يكون عمرك 18 عامًا أو أكثر للتقديم."}, "h": "Date of birth"}, {"id": "gender", "type": "radio", "req": true, "en": "Gender", "ar": "النوع", "opts": [["female", "Female", "أنثى"], ["male", "Male", "ذكر"]], "h": "Gender"}, {"id": "occupation", "type": "text", "req": false, "en": "Occupation", "ar": "المهنة", "h": "Occupation"}, {"id": "phone", "type": "tel", "req": true, "en": "Phone / WhatsApp number", "ar": "رقم الهاتف / واتساب", "h": "Phone / WhatsApp"}, {"id": "email", "type": "email", "req": true, "en": "Email", "ar": "البريد الإلكتروني", "h": "Email"}, {"id": "ec_name", "type": "text", "req": true, "en": "Emergency contact — name and relationship to you", "ar": "شخص للتواصل في حالات الطوارئ — الاسم وصلة القرابة أو العلاقة", "h": "Emergency contact"}, {"id": "ec_phone", "type": "tel", "req": true, "en": "Emergency contact — phone number", "ar": "رقم هاتف شخص الطوارئ", "h": "Emergency phone"}, {"id": "referral", "type": "text", "req": true, "en": "How did you hear about The Inner Ground Program? If someone referred you, please share their name.", "ar": "كيف وصل إليك البرنامج؟ إذا رشّحه لك شخص ما، يرجى ذكر اسمه.", "h": "Referral / how they heard"}]}, {"title": {"en": "Your Intention", "ar": "نيتك من الرحلة"}, "fields": [{"id": "intention", "type": "textarea", "req": true, "en": "What brings you to this journey at this point in your life? What are you hoping to explore, understand, or work through?", "ar": "ما الذي يجذبك إلى هذه الرحلة في هذه المرحلة من حياتك؟ وما الذي تأمل/ين استكشافه أو فهمه أو العمل عليه؟", "h": "Intention"}, {"id": "focus", "type": "textarea", "req": false, "en": "Is there a particular question, life transition, pattern, or area of your life that you are bringing into this experience?", "ar": "هل هناك سؤال معين، أو مرحلة انتقالية، أو نمط متكرر، أو جانب من حياتك ترغب/ين في إحضاره معك إلى هذه التجربة؟", "h": "Question or pattern brought"}]}, {"title": {"en": "Previous Experience", "ar": "الخبرات السابقة"}, "fields": [{"id": "experience", "type": "checkbox", "req": true, "en": "Which of the following have you experienced before?", "ar": "أيٌّ من الخبرات التالية سبق أن مررت بها؟", "opts": [["altered", "Non-ordinary or altered states of consciousness", "حالات غير معتادة أو متغيّرة من الوعي"], ["meditation", "Meditation / Vipassana", "التأمل / الفيباسانا"], ["breathwork", "Breathwork", "تمارين التنفس"], ["energy", "Energy / spiritual practices", "ممارسات الطاقة / الممارسات الروحية"], ["therapy", "Therapy / psychological work", "العلاج النفسي / العمل النفسي"], ["somatic", "Somatic / body-based practices", "الممارسات الجسدية / العمل القائم على الجسد"], ["growth", "Consciousness / personal-development work", "العمل على الوعي / التطوير الشخصي"], ["none", "None of these", "لا شيء مما سبق"]], "exclusive": "none", "h": "Previous experience"}, {"id": "experience_detail", "type": "textarea", "req": false, "show": ["experience", "any_except", "none"], "en": "Briefly tell us about your experience, including when your most recent experience was and whether anything difficult or unresolved came up.", "ar": "يرجى مشاركتنا باختصار بتجربتك، بما في ذلك موعد آخر تجربة، وما إذا ظهر خلالها أي شيء صعب أو لم يُحسم بعد.", "h": "Experience details"}]}, {"title": {"en": "Physical Health", "ar": "الصحة الجسدية"}, "fields": [{"id": "medical", "type": "radio", "req": true, "en": "Do you currently have, or have you ever had, any significant medical condition?", "ar": "هل لديك حاليًا، أو سبق أن كانت لديك، أي حالة طبية مهمة؟", "opts": [["no", "No", "لا"], ["yes", "Yes", "نعم"], ["unsure", "I’m not sure", "لست متأكدًا/ة"]], "h": "Significant medical condition"}, {"id": "medical_detail", "type": "textarea", "req": true, "show": ["medical", "in", ["yes", "unsure"]], "en": "Please tell us about the condition(s), their current status, and any treatment you receive.", "ar": "يرجى ذكر الحالة/الحالات، ووضعها الحالي، وأي علاج تخضع/ين له.", "h": "Medical details"}, {"id": "conditions", "type": "checkbox", "req": true, "en": "Have you ever been diagnosed with, or experienced, any of the following?", "ar": "هل سبق أن تم تشخيصك بأيٍّ مما يلي، أو مررت به؟", "opts": [["heart", "Heart condition or irregular heartbeat", "مرض في القلب أو عدم انتظام في ضربات القلب"], ["bp", "High blood pressure", "ارتفاع ضغط الدم"], ["stroke", "Stroke", "سكتة دماغية"], ["seizure", "Epilepsy or seizures", "صرع أو نوبات تشنج"], ["diabetes", "Diabetes", "السكري"], ["liver", "Liver or kidney condition", "مرض في الكبد أو الكلى"], ["none", "None of these", "لا شيء مما سبق"]], "exclusive": "none", "h": "Specific conditions"}, {"id": "conditions_detail", "type": "textarea", "req": true, "show": ["conditions", "any_except", "none"], "en": "Please share more detail, including whether the condition is current and how it is managed.", "ar": "يرجى توضيح المزيد، بما في ذلك ما إذا كانت الحالة قائمة حاليًا وكيف تتم متابعتها.", "h": "Condition details"}, {"id": "current_illness", "type": "radio", "req": true, "en": "Are you currently experiencing any significant illness, fever, infection, unexplained physical symptoms, or recent major change in your health?", "ar": "هل تعاني/ن حاليًا من أي مرض مهم، أو حمى، أو عدوى، أو أعراض جسدية غير مفسّرة، أو تغيّر كبير وحديث في حالتك الصحية؟", "opts": [["no", "No", "لا"], ["yes", "Yes", "نعم"], ["unsure", "I’m not sure", "لست متأكدًا/ة"]], "h": "Current illness"}, {"id": "current_illness_detail", "type": "textarea", "req": true, "show": ["current_illness", "in", ["yes", "unsure"]], "en": "Please explain.", "ar": "يرجى التوضيح.", "h": "Current illness details"}, {"id": "pregnancy", "type": "radio", "req": true, "show": ["gender", "in", ["female"]], "en": "Are you currently pregnant, trying to conceive, or breastfeeding?", "ar": "هل أنتِ حاليًا حامل، أو تحاولين الحمل، أو ترضعين رضاعة طبيعية؟", "opts": [["no", "No", "لا"], ["yes", "Yes", "نعم"], ["private", "Prefer to discuss privately", "أفضّل مناقشة ذلك بشكل خاص"]], "h": "Pregnant / breastfeeding"}, {"id": "allergies", "type": "textarea", "req": true, "en": "Do you have any allergies (food, medication, or other) or dietary requirements?", "ar": "هل لديك أي حساسية (من طعام أو دواء أو غير ذلك) أو احتياجات غذائية خاصة؟", "hint": {"en": "Please write “None” if not applicable.", "ar": "يرجى كتابة «لا يوجد» إذا لم ينطبق ذلك."}, "h": "Allergies & diet"}, {"id": "physical", "type": "textarea", "req": false, "en": "Do you have any injuries, physical limitations, or mobility needs we should be aware of? (For example, difficulty sitting or lying on the floor for long periods.)", "ar": "هل لديك أي إصابات أو قيود جسدية أو احتياجات تتعلق بالحركة ينبغي أن نعرفها؟ (مثل صعوبة الجلوس أو الاستلقاء على الأرض لفترات طويلة.)", "h": "Physical limitations"}]}, {"title": {"en": "Mental & Emotional Health", "ar": "الصحة النفسية والعاطفية"}, "fields": [{"id": "psych", "type": "radio", "req": true, "en": "Have you ever experienced or been diagnosed with any significant psychological or psychiatric condition, including severe depression/anxiety, mania, psychosis, significant dissociation, PTSD, or psychiatric hospitalization?", "ar": "هل سبق أن مررت أو تم تشخيصك بأي حالة أو اضطراب نفسي مهم، بما في ذلك الاكتئاب أو القلق الشديد، أو الهوس، أو الذهان، أو الانفصال/التفكك النفسي الملحوظ، أو اضطراب ما بعد الصدمة، أو دخول مستشفى للصحة النفسية؟", "opts": [["no", "No", "لا"], ["yes", "Yes", "نعم"], ["private", "Prefer to discuss privately", "أفضّل مناقشة ذلك بشكل خاص"], ["unsure", "I’m not sure", "لست متأكدًا/ة"]], "h": "Psychological history"}, {"id": "psych_detail", "type": "textarea", "req": false, "show": ["psych", "in", ["yes", "unsure"]], "en": "Please briefly describe what is relevant for us to know about your history and your current state.", "ar": "يرجى أن تصف/ي باختصار ما ترى/ين أنه من المهم أن نعرفه عن تاريخك وحالتك الحالية.", "h": "Psychological details"}, {"id": "family_history", "type": "radio", "req": true, "en": "Has any close family member (parent, sibling, or child) been diagnosed with schizophrenia, bipolar disorder, or psychosis?", "ar": "هل تم تشخيص أي من أقاربك من الدرجة الأولى (أحد الوالدين أو الإخوة أو الأبناء) بالفصام أو الاضطراب ثنائي القطب أو الذهان؟", "opts": [["no", "No", "لا"], ["yes", "Yes", "نعم"], ["unsure", "I’m not sure", "لست متأكدًا/ة"]], "h": "Family history (psychosis/bipolar)"}, {"id": "family_history_detail", "type": "textarea", "req": false, "show": ["family_history", "in", ["yes"]], "en": "Please share who, and the diagnosis if known.", "ar": "يرجى ذكر صلة القرابة والتشخيص إن كان معروفًا.", "h": "Family history details"}, {"id": "self_harm", "type": "radio", "req": true, "en": "Have you ever experienced suicidal thoughts, self-harm, or a suicide attempt?", "ar": "هل سبق أن مررت بأفكار انتحارية، أو إيذاء للنفس، أو محاولة انتحار؟", "opts": [["no", "No", "لا"], ["past", "Yes, in the past", "نعم، في الماضي"], ["current", "Yes, currently", "نعم، حاليًا"], ["private", "Prefer to discuss privately", "أفضّل مناقشة ذلك بشكل خاص"]], "h": "Suicidal thoughts / self-harm"}, {"id": "support", "type": "radio", "req": true, "en": "Are you currently working with a therapist, psychiatrist, or doctor for your mental or emotional health?", "ar": "هل تتابع/ين حاليًا مع معالج نفسي أو طبيب نفسي أو طبيب آخر بخصوص صحتك النفسية أو العاطفية؟", "opts": [["no", "No", "لا"], ["aware", "Yes, and they know I’m applying", "نعم، وهو على علم بتقديمي"], ["unaware", "Yes, but they don’t know I’m applying", "نعم، لكنه ليس على علم بتقديمي"], ["prefer_not", "Prefer not to say", "أفضّل عدم الإجابة"]], "h": "Current therapist / doctor"}, {"id": "emotional_now", "type": "textarea", "req": false, "en": "Is there anything about your current emotional or psychological state that you feel we should know before considering your participation?", "ar": "هل هناك أي شيء يتعلق بحالتك النفسية أو العاطفية الحالية ترى/ين أنه من المهم أن نعرفه قبل النظر في مشاركتك؟", "h": "Current emotional state"}]}, {"title": {"en": "Medication & Substances", "ar": "الأدوية والمواد"}, "fields": [{"id": "meds", "type": "radio", "req": true, "en": "Are you currently taking any prescription medications, over-the-counter medications, supplements, herbs, or herbal preparations?", "ar": "هل تتناول/ين حاليًا أي أدوية موصوفة، أو أدوية بدون وصفة طبية، أو مكملات غذائية، أو أعشاب، أو مستحضرات عشبية؟", "opts": [["no", "No", "لا"], ["yes", "Yes", "نعم"]], "h": "Taking medications"}, {"id": "meds_detail", "type": "textarea", "req": true, "show": ["meds", "in", ["yes"]], "en": "Please list them, including dose/frequency if known, and what they are used for.", "ar": "يرجى ذكرها، مع الجرعة/معدل الاستخدام إن كان معروفًا، وسبب الاستخدام.", "h": "Medication details"}, {"id": "psych_meds", "type": "radio", "req": true, "en": "Are you currently taking, or have you recently taken (within the past few months), any antidepressant or other psychiatric medication — such as SSRIs, SNRIs, MAOIs, lithium, or antipsychotics?", "ar": "هل تتناول/ين حاليًا، أو تناولت مؤخرًا (خلال الأشهر القليلة الماضية)، أي مضاد للاكتئاب أو دواء نفسي آخر — مثل SSRIs أو SNRIs أو MAOIs أو الليثيوم أو مضادات الذهان؟", "opts": [["no", "No", "لا"], ["yes", "Yes", "نعم"], ["unsure", "I’m not sure", "لست متأكدًا/ة"]], "h": "Psychiatric medication"}, {"id": "psych_meds_detail", "type": "textarea", "req": true, "show": ["psych_meds", "in", ["yes", "unsure"]], "en": "Please share the name, dose, and when you last took it.", "ar": "يرجى ذكر اسم الدواء والجرعة وآخر موعد لتناوله.", "h": "Psychiatric medication details"}, {"id": "substances", "type": "radio", "req": true, "en": "Do you currently use, or have you recently used, alcohol, cannabis, nicotine, caffeine, or any other psychoactive or recreational substances?", "ar": "هل تستخدم/ين حاليًا، أو استخدمت مؤخرًا، الكحول أو القنب أو النيكوتين أو الكافيين أو أي مواد أخرى ذات تأثير نفسي أو ترفيهي؟", "opts": [["no", "No", "لا"], ["yes", "Yes", "نعم"]], "h": "Substance use"}, {"id": "substances_detail", "type": "textarea", "req": true, "show": ["substances", "in", ["yes"]], "en": "Please tell us which ones, how often, and when you last used each of them.", "ar": "يرجى ذكرها، ومعدل استخدامها، وتاريخ آخر استخدام لكل منها.", "h": "Substance details"}, {"id": "dependence", "type": "radio", "req": true, "en": "Have you ever experienced dependence, withdrawal, or difficulty stopping a substance?", "ar": "هل سبق أن عانيت من الاعتماد على مادة ما، أو أعراض انسحاب، أو صعوبة في التوقف عن استخدامها؟", "opts": [["no", "No", "لا"], ["yes", "Yes", "نعم"], ["private", "Prefer to discuss privately", "أفضّل مناقشة ذلك بشكل خاص"]], "h": "Dependence history"}]}, {"title": {"en": "Readiness & Availability", "ar": "الاستعداد والالتزام"}, "fields": [{"id": "readiness", "type": "radio", "req": true, "en": "How would you describe your current readiness for this journey?", "ar": "كيف تصف/ين استعدادك الحالي لهذه الرحلة؟", "opts": [["ready", "I feel ready and clear about my intention", "أشعر أنني مستعد/ة وواضح/ة بشأن نيتي"], ["open", "I feel open but also have some uncertainty", "أشعر بالانفتاح، ولكن لدي بعض التردد"], ["concerns", "I have significant concerns or questions", "لدي مخاوف أو أسئلة مهمة"], ["unsure", "I’m not sure yet", "لست متأكدًا/ة بعد"]], "h": "Readiness"}, {"id": "availability", "type": "radio", "req": true, "en": "The program includes five online preparation sessions during November and the experience on 19–20 November. Are you able to attend all of them?", "ar": "يتضمن البرنامج خمس جلسات تحضيرية أونلاين خلال شهر نوفمبر، بالإضافة إلى التجربة يومي 19–20 نوفمبر. هل يمكنك حضورها جميعًا؟", "hint": {"en": "If you can’t attend a session live, it will be recorded for you.", "ar": "إذا لم تتمكن/ي من حضور إحدى الجلسات مباشرةً، سيتم تسجيلها لك."}, "opts": [["yes", "Yes, I can attend all of them", "نعم، يمكنني حضورها جميعًا"], ["no", "No", "لا"]], "h": "Can attend all sessions"}, {"id": "availability_detail", "type": "textarea", "req": true, "show": ["availability", "in", ["no"]], "en": "Please tell us more.", "ar": "يرجى التوضيح.", "h": "Availability details"}, {"id": "commitment", "type": "radio", "req": true, "en": "Are you willing to commit to the preparation guidelines, communicate honestly with the facilitators, and respect the boundaries and agreements of the container?", "ar": "هل أنت مستعد/ة للالتزام بإرشادات التحضير، والتواصل بصدق مع الميسّرين، واحترام الحدود والاتفاقات الخاصة بالبرنامج؟", "opts": [["yes", "Yes", "نعم"], ["questions", "I have questions before committing", "لدي أسئلة قبل أن ألتزم"], ["no", "No", "لا"]], "h": "Willing to commit"}, {"id": "commitment_questions", "type": "textarea", "req": true, "show": ["commitment", "in", ["questions"]], "en": "What would you like to ask us before committing? We’ll answer you personally.", "ar": "ما الذي تود/ين أن تسألنا عنه قبل الالتزام؟ سنجيبك بشكل شخصي.", "h": "Questions before committing"}, {"id": "concerns", "type": "textarea", "req": false, "en": "Is there anything you feel concerned, uncertain, or uncomfortable about regarding the experience or the process?", "ar": "هل هناك أي شيء يثير لديك القلق أو عدم اليقين أو عدم الارتياح بخصوص التجربة أو البرنامج ككل؟", "h": "Concerns"}]}, {"title": {"en": "Final Disclosure & Consent", "ar": "الإفصاح النهائي والموافقة"}, "fields": [{"id": "final_disclosure", "type": "textarea", "req": true, "en": "Is there anything else about your health, body, psychological history, previous experiences, medications, substance use, relationships, or current circumstances that you believe we should know before considering your participation?", "ar": "هل هناك أي شيء آخر يتعلق بصحتك، أو جسدك، أو تاريخك النفسي، أو خبراتك السابقة، أو أدويتك، أو استخدامك للمواد، أو علاقاتك، أو ظروفك الحالية ترى/ين أنه يجب أن نعرفه قبل النظر في مشاركتك؟", "hint": {"en": "Please write “Nothing further” if not applicable.", "ar": "يرجى كتابة «لا يوجد» إذا لم ينطبق ذلك."}, "h": "Final disclosure"}, {"id": "note", "type": "note", "en": "Please do not stop, reduce, taper, or change any prescribed medication because of this form. Any medication-related decision should be reviewed with an appropriate medical professional.", "ar": "يرجى عدم إيقاف أو تقليل أو تغيير أي دواء موصوف بسبب هذا النموذج. يجب مراجعة أي قرار يتعلق بالأدوية مع مختص طبي مناسب.", "title": {"en": "Important note", "ar": "ملاحظة مهمة"}}, {"id": "consent", "type": "consent", "req": true, "en": "Participant Acknowledgment & Consent", "ar": "الإقرار والموافقة", "opts": [["honest", "I confirm that I have answered this form honestly and to the best of my knowledge.", "أقر بأنني أجبت عن هذا النموذج بصدق وبقدر ما أعلم."], ["age", "I confirm that I am 18 years of age or older.", "أقر بأن عمري 18 عامًا أو أكثر."], ["process", "I understand that this program involves preparation, a one-night group experience, and integration, and that participation is subject to screening and acceptance.", "أفهم أن هذا البرنامج يشمل التحضير، وتجربة جماعية لليلة واحدة، والتكامل، وأن المشاركة تخضع للتقييم والقبول."], ["updates", "I understand that I am responsible for informing the facilitators of any relevant changes in my health, medications, psychological or emotional state, substance use, or personal circumstances before participating.", "أفهم أن من مسؤوليتي إبلاغ الميسّرين بأي تغيّرات ذات صلة بصحتي، أو أدويتي، أو حالتي النفسية أو العاطفية، أو استخدامي للمواد، أو ظروفي الشخصية قبل المشاركة."], ["disclosure", "I understand the importance of not withholding information that may be relevant to my safety or the safety of others.", "أفهم أهمية عدم حجب أي معلومات قد تكون ذات صلة بسلامتي أو بسلامة الآخرين."], ["confidential", "I agree to keep what other participants share confidential, and not to take photos or make recordings during the program.", "أتعهد بالحفاظ على سرية ما يشاركه المشاركون الآخرون، وبعدم التقاط صور أو إجراء تسجيلات خلال البرنامج."], ["discretion", "I agree to keep my experience of this program private, and not to share about it publicly, including on social media.", "أتعهد بالحفاظ على خصوصية تجربتي في هذا البرنامج، وعدم مشاركتها علنًا، بما في ذلك عبر وسائل التواصل الاجتماعي."], ["contact", "I agree to be contacted by the facilitators about my application, including for a private conversation if needed.", "أوافق على أن يتواصل معي الميسّرون بخصوص طلبي، بما في ذلك إجراء محادثة خاصة إذا لزم الأمر."], ["data", "I consent to the information in this form being stored securely and used only by the facilitators to review my application and support my safety. It will not be shared with anyone else.", "أوافق على حفظ المعلومات الواردة في هذا النموذج بشكل آمن، واستخدامها من قِبل الميسّرين فقط لمراجعة طلبي ودعم سلامتي، ولن تتم مشاركتها مع أي طرف آخر."], ["payment", "I understand that payment details and the cancellation policy will be shared upon acceptance, and that my place is confirmed once payment is complete.", "أفهم أن تفاصيل الدفع وسياسة الإلغاء ستتم مشاركتها معي عند القبول، وأن مكاني يتأكد بعد إتمام الدفع."], ["voluntary", "I understand that my participation is voluntary and at my own responsibility, and that I have the opportunity to ask questions and disclose any relevant information before the experience.", "أفهم أن مشاركتي طوعية وعلى مسؤوليتي الخاصة، وأن لدي فرصة لطرح الأسئلة والإفصاح عن أي معلومات ذات صلة قبل التجربة."], ["proceed", "I have read and understood the above and wish to proceed with my application.", "قرأت وفهمت ما سبق، وأرغب في استكمال طلب المشاركة."]], "h": "Consent"}]}], "thanks": {"en": ["Thank you for sharing yourself with us.", "We will read your application with care and be in touch with you soon."], "ar": ["شكرًا لمشاركتك نفسك معنا.", "سنقرأ طلبك بعناية ونتواصل معك قريبًا."]}};

     req:"هذا السؤال إجباري.",email:"يرجى إدخال بريد إلكتروني صحيح.",age:"يجب أن يكون عمرك 18 عامًا أو أكثر للتقديم.",consent:"يرجى تأكيد جميع البنود للمتابعة.",tel:"يرجى إدخال رقم هاتف صحيح بالأرقام فقط (مع كود الدولة إذا كان الرقم من خارج مصر).",qs:"يرجى كتابة أسئلتك حتى نتمكن من الإجابة عنها.",cancel:"إلغاء",
     fail:"حدث خطأ أثناء الإرسال. يرجى المحاولة مرة أخرى أو التواصل معنا عبر البريد الإلكتروني.",demo:"وضع المعاينة — النموذج غير متصل بعد، لذلك لم يتم إرسال أي شيء."}
};
let lang='en', step=0; const ans={};
const N=FORM.sections.length, $=s=>document.querySelector(s);
const allFields=FORM.sections.flatMap(s=>s.fields);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function visible(f){ if(!f.show) return true; const [src,mode,val]=f.show; const v=ans[src];
  if(mode==='in') return val.includes(v);
  if(mode==='any_except') return Array.isArray(v)&&v.some(x=>x!==val); return true;}
function fieldHTML(f){
  const L=f[lang], r=f.req?'<span class="req">*</span>':'';
  const hint=f.hint?`<div class="hint">${esc(f.hint[lang])}</div>`:'';
  const err=`<div class="err"></div>`;
  const sub=f.show?' sub':'';
  if(f.type==='note') return `<div class="note"><b>${esc(f.title[lang])}</b>${esc(L)}</div>`;
  if(f.type==='consent') return `<div class="q consent" data-id="${f.id}"><span class="label">${esc(L)}${r}</span><div class="opts">${
    f.opts.map(o=>`<label class="opt"><input type="checkbox" name="${f.id}" value="${o[0]}" ${(ans[f.id]||[]).includes(o[0])?'checked':''}><span>${esc(lang==='en'?o[1]:o[2])}</span></label>`).join('')}</div>${err}</div>`;
  let ctl='';
  if(f.type==='radio'||f.type==='checkbox'){
    ctl=`<div class="opts">${f.opts.map(o=>{const on=f.type==='radio'?ans[f.id]===o[0]:(ans[f.id]||[]).includes(o[0]);
      return `<label class="opt"><input type="${f.type}" name="${f.id}" value="${o[0]}" ${on?'checked':''}><span>${esc(lang==='en'?o[1]:o[2])}</span></label>`}).join('')}</div>`;
  } else if(f.type==='textarea') ctl=`<textarea name="${f.id}" id="${f.id}">${esc(ans[f.id]||'')}</textarea>`;
  else ctl=`<input type="${f.type}" name="${f.id}" id="${f.id}" value="${esc(ans[f.id]||'')}" ${f.type==='date'?'max="'+new Date().toISOString().slice(0,10)+'"':''}${f.type==='tel'?' inputmode="tel" autocomplete="tel" placeholder="+20 1XX XXX XXXX"':''}${f.type==='email'?' inputmode="email" autocomplete="email"':''}>`;
  if(f.modal){ const m=f.modal, has=(ans[m.id]||'').trim();
    ctl+=`<button type="button" class="linkbtn" data-modal="${f.id}" ${ans[f.id]===m.on&&has?'':'hidden'}>${esc(m.edit[lang])}</button>`; }
  return `<div class="q${sub}" data-id="${f.id}" ${visible(f)?'':'hidden'}><label class="label" for="${f.id}">${esc(L)}${r}</label>${hint}${ctl}${err}</div>`;
}
function render(){
  const u=UI[lang]; document.documentElement.lang=lang; document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  document.querySelectorAll('.lang button').forEach(b=>b.toggleAttribute('data-on',b.dataset.l===lang));
  $('#eyebrow').textContent=u.eyebrow;
  const card=$('#card'), prog=$('#progress');
  if(step===0){ prog.hidden=true;
    card.innerHTML=`<div class="intro"><h2>${esc(FORM.intro_h[lang])}</h2>${FORM.intro[lang].map(p=>`<p>${esc(p)}</p>`).join('')}</div>
      <div class="nav"><span></span><button type="button" class="btn" id="go">${u.begin}</button></div>`;
    $('#go').onclick=()=>{step=1;render();scrollTo({top:0,behavior:'smooth'})}; return; }
  if(step>N){ prog.hidden=true; const t=FORM.thanks[lang];
    card.innerHTML=`<div class="thanks"><h2>${esc(t[0])}</h2><p>${esc(t[1])}</p>${window.__demo?`<p class="demo">${u.demo}</p>`:''}</div>`; return; }
  const s=FORM.sections[step-1]; prog.hidden=false;
  $('#pmeta').textContent=`${u.section(step,N)} · ${s.title[lang]}`; $('#ppct').textContent=Math.round((step-1)/N*100)+'%';
  $('#pbar').style.width=((step-1)/N*100)+'%';
  card.innerHTML=`<div class="sec-n">${esc(u.section(step,N))}</div><h2>${esc(s.title[lang])}</h2>${s.fields.map(fieldHTML).join('')}
    <div class="nav"><button type="button" class="btn ghost" id="back">${u.back}</button><button type="button" class="btn" id="next">${step===N?u.submit:u.next}</button></div>`;
  $('#back').onclick=()=>{step--;render();scrollTo({top:0})};
  $('#next').onclick=()=>{ if(!validate(s)) return; if(step===N) send(); else {step++;render();scrollTo({top:0,behavior:'smooth'})} };
}
function read(e){
  const t=e.target, f=allFields.find(x=>x.id===t.name); if(!f) return;
  if(t.type==='checkbox'){ let v=ans[f.id]||[];
    if(t.checked){ v=[...new Set([...v,t.value])]; if(f.exclusive){ if(t.value===f.exclusive) v=[t.value]; else v=v.filter(x=>x!==f.exclusive);} }
    else v=v.filter(x=>x!==t.value);
    ans[f.id]=v; document.querySelectorAll(`input[name="${f.id}"]`).forEach(i=>i.checked=v.includes(i.value));
  } else if(t.type==='tel'){ const c=t.value.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^\d+\s\-()]/g,''); if(c!==t.value) t.value=c; ans[f.id]=c; }
  else { ans[f.id]=t.value; if(f.modal&&e.type==='change'){ if(t.value===f.modal.on) openModal(f); else { const b=document.querySelector(`[data-modal="${f.id}"]`); if(b) b.hidden=true; } } }
  t.closest('.q')?.classList.remove('bad');
  allFields.forEach(g=>{ if(g.show){ const el=document.querySelector(`.q[data-id="${g.id}"]`); if(el) el.hidden=!visible(g);} });
}
document.addEventListener('input',read); document.addEventListener('change',read);
function age(d){const b=new Date(d),n=new Date();let a=n.getFullYear()-b.getFullYear();const m=n.getMonth()-b.getMonth();if(m<0||(m===0&&n.getDate()<b.getDate()))a--;return a}
function validate(s){ const u=UI[lang]; let first=null;
  s.fields.forEach(f=>{ const el=document.querySelector(`.q[data-id="${f.id}"]`); if(!el||!f.req||!visible(f)) return;
    const v=ans[f.id]; let msg='';
    if(f.type==='consent'){ if(!v||v.length<f.opts.length) msg=u.consent; }
    else if(Array.isArray(v)?!v.length:!(v||'').trim()) msg=u.req;
    else if(f.type==='email'&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) msg=u.email;
    else if(f.type==='date'&&age(v)<18) msg=u.age;
    else if(f.type==='tel'&&!/^\+?\d{8,15}$/.test(v.replace(/[\s\-()]/g,''))) msg=u.tel;
    else if(f.modal&&v===f.modal.on&&!(ans[f.modal.id]||'').trim()) msg=u.qs;
    el.classList.toggle('bad',!!msg); el.querySelector('.err').textContent=msg; if(msg&&!first) first=el; });
  if(first) first.scrollIntoView({behavior:'smooth',block:'center'}); return !first; }
const FLAG=['medical','conditions','current_illness','pregnancy','psych','family_history','self_harm','psych_meds','dependence'];
function payload(){ const items=[];
  FORM.sections.forEach(s=>s.fields.forEach(f=>{ if(f.type==='note'||!visible(f)) return; let v=ans[f.id];
    if(f.type==='consent'){ v=(v&&v.length===f.opts.length)?'All statements confirmed':''; }
    else if(f.opts&&v){ const lab=x=>(f.opts.find(o=>o[0]===x)||[,x])[1]; v=Array.isArray(v)?v.map(lab).join('; '):lab(v); }
    items.push({id:f.id,section:s.title.en,h:f.h,q:f.en,a:v||'',flag:FLAG.includes(f.id)&&!!v&&!/^(No|None of these)$/.test(v)}); }));
  return {submitted_at:new Date().toISOString(),language:lang==='ar'?'Arabic':'English',items}; }
function send(){ const b=$('#next'); b.disabled=true; b.textContent=UI[lang].sending; const data=payload();
  const done=()=>{step=N+1;render();scrollTo({top:0})}, fail=()=>{b.disabled=false;b.textContent=UI[lang].submit;alert(UI[lang].fail)};
  if(window.google&&google.script&&google.script.run){ google.script.run.withSuccessHandler(done).withFailureHandler(fail).submitApplication(data); }
  else if(SUBMIT_URL){ fetch(SUBMIT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)}).then(done).catch(fail); }
  else { window.__demo=true; console.log('Preview payload',data); setTimeout(done,600); } }
let modalField=null;
function openModal(f){ modalField=f; const m=f.modal,d=$('#qmodal');
  $('#qm-title').textContent=m.title[lang]; $('#qm-prompt').textContent=m.prompt[lang]; $('#qm-text').value=ans[m.id]||'';
  $('#qm-save').textContent=m.save[lang]; $('#qm-cancel').textContent=UI[lang].cancel; d.showModal(); setTimeout(()=>$('#qm-text').focus(),50); }
document.addEventListener('click',e=>{ const b=e.target.closest('[data-modal]'); if(b) openModal(allFields.find(x=>x.id===b.dataset.modal)); });
function closeModal(save){ const f=modalField; if(!f) return; if(save) ans[f.modal.id]=$('#qm-text').value; $('#qmodal').close();
  const has=(ans[f.modal.id]||'').trim(), b=document.querySelector(`[data-modal="${f.id}"]`); if(b) b.hidden=!has;
  if(has) document.querySelector(`.q[data-id="${f.id}"]`)?.classList.remove('bad'); }
window.addEventListener('DOMContentLoaded',()=>{});
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;render()});
if(/(^|[?&])lang=ar/.test(location.search)) lang='ar';
render();
</script>
